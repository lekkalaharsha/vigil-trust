[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-trust"
version = "0.1.0"
description = "VIGIL-TRUST: Verifiable Vehicle Telematics Security Gateway (hackathon prototype)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "cryptography==44.0.0",
    "cbor2==5.6.5",
    "paho-mqtt==2.1.0",
    "python-can==4.5.0",
    "cantools==39.4.6",
    "pyserial==3.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["edge*", "backend*", "attack_lab*"]
