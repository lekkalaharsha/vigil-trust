# Local demo Mosquitto config for the optional MQTT transport
# (edge/transport/mqtt.py). TLS material comes from scripts/dev_pki.py.
# NOT production config: no ACL file, no persistence tuning.

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/backend.crt
keyfile /mosquitto/certs/backend.key
require_certificate true
use_identity_as_username true

persistence false
log_dest stdout
